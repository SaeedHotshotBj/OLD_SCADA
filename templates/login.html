<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ورود به SCADA</title>


<style>

@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap');


* {

    box-sizing: border-box;

    font-family: "Vazirmatn", Tahoma, sans-serif;

}



body {


    margin: 0;

    height: 100vh;

    background: linear-gradient(
        135deg,
        #0f2027,
        #203a43,
        #2c5364
    );

    display: flex;

    justify-content: center;

    align-items: center;

}



.login-box {


    width: 380px;

    background: rgba(255,255,255,0.12);

    backdrop-filter: blur(15px);

    border-radius: 20px;

    padding: 40px;

    box-shadow:

    0 15px 40px rgba(0,0,0,0.35);

    color:white;

}



.logo {


    text-align:center;

    font-size:45px;

    margin-bottom:10px;

}



h2 {


    text-align:center;

    margin-bottom:30px;

    font-weight:800;

}



.input-box {


    margin-bottom:20px;

}



.input-box label {


    display:block;

    margin-bottom:8px;

    font-size:15px;

}



.input-box input {


    width:100%;

    padding:13px;

    border:none;

    outline:none;

    border-radius:12px;

    font-size:16px;

    background:white;

}



button {


    width:100%;

    padding:14px;

    border:none;

    border-radius:12px;

    background:#00c6ff;

    color:white;

    font-size:18px;

    font-weight:bold;

    cursor:pointer;

    transition:0.3s;

}



button:hover {


    background:#0072ff;

    transform:translateY(-2px);

}



.footer {


    text-align:center;

    margin-top:25px;

    font-size:13px;

    opacity:0.8;

}



.scada-title {


    color:#00c6ff;

    font-weight:800;

}


</style>


</head>



<body>


<div class="login-box">


<div class="logo">

⚡

</div>


<h2>

ورود به

<span class="scada-title">
SCADA
</span>

</h2>



<form method="POST">



<div class="input-box">


<label>
نام کاربری
</label>


<input

type="text"

name="username"

placeholder="نام کاربری را وارد کنید"

required

>


</div>




<div class="input-box">


<label>
رمز عبور
</label>


<input

type="password"

name="password"

placeholder="رمز عبور را وارد کنید"

required

>


</div>




<button type="submit">

ورود

</button>



</form>



<div class="footer">

سیستم مانیتورینگ صنعتی SCADA

<br>

© 2026

</div>



</div>



</body>


</html>
