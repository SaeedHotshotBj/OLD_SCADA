<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>گزارش کارکرد ماشین</title>


<!-- Persian Date Picker CSS -->
<link rel="stylesheet" href="https://unpkg.com/persian-datepicker@latest/dist/css/persian-datepicker.min.css">


<!-- jQuery -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>


<!-- Persian Date Library -->
<script src="https://unpkg.com/persian-date@latest/dist/persian-date.min.js"></script>


<!-- Persian Date Picker -->
<script src="https://unpkg.com/persian-datepicker@latest/dist/js/persian-datepicker.min.js"></script>



<style>


body {

    font-family: Tahoma;
    background:#f5f5f5;
    padding:20px;
    direction:rtl;

}



h2 {

    text-align:center;

}



form {

    text-align:center;
    margin-bottom:20px;

}



input {

    padding:8px;
    margin:5px;
    width:150px;
    text-align:center;

}



button {

    padding:8px 15px;
    cursor:pointer;

}



table {

    width:90%;
    margin:auto;
    border-collapse:collapse;
    background:white;
    direction:rtl;

}



th, td {

    border:1px solid #ccc;
    padding:8px;
    text-align:center;

}



th {

    background:#007BFF;
    color:white;

}



.total-row {

    font-weight:bold;
    background:#e8f0ff;

}


</style>


</head>



<body>


{% include 'header.html' %}



<h2>

گزارش کارکرد ماشین

</h2>




<form method="post" action="/machine_report">


<input

id="date_a"

type="text"

name="date_a"

placeholder="از تاریخ"

autocomplete="off"

required

>




<input

id="date_b"

type="text"

name="date_b"

placeholder="تا تاریخ"

autocomplete="off"

required

>



<button type="submit">

فیلتر

</button>


<button 
    formaction="/export_machine_excel"
    formmethod="post"
    type="submit">

    خروجی Excel

</button>


</form>





<table>


<thead>


<tr>

<th>
زمان
</th>


<th>
Mill
</th>


<th>
Mixer
</th>


<th>
PressPellet
</th>


</tr>


</thead>



<tbody>



{% if data %}



{% for row in data %}



<tr>


<td>

{{ row.timestamp }}

</td>



<td>

{{ row.Mill }}

</td>



<td>

{{ row.Mixer }}

</td>



<td>

{{ row.PressPellet }}

</td>



</tr>



{% endfor %}



{% else %}



<tr>

<td colspan="4">

داده ای وجود ندارد

</td>

</tr>



{% endif %}



</tbody>



</table>





<script>



$("#date_a").persianDatepicker({

    format: "YYYY/MM/DD",

    autoClose: true

});




$("#date_b").persianDatepicker({

    format: "YYYY/MM/DD",

    autoClose: true

});



</script>



</body>


</html>
