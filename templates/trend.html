```html
<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<title>SCADA Trend</title>


<!-- Chart JS -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>


<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1/dist/chartjs-plugin-zoom.min.js"></script>


<!-- Persian Font -->
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">


<!-- Persian Date Picker -->

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/persian-datepicker@1.2.0/dist/css/persian-datepicker.min.css">


<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/persian-date@1.1.0/dist/persian-date.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/persian-datepicker@1.2.0/dist/js/persian-datepicker.min.js"></script>



<style>


*{

box-sizing:border-box;

}



body{


margin:0;

background:#eef3f8;

font-family:'Vazirmatn',Tahoma;

color:#1e293b;


}



/* HEADER */


.header{


background:
linear-gradient(
135deg,
#0f172a,
#1d4ed8
);


padding:35px;

text-align:center;

color:white;

box-shadow:0 5px 20px #aaa;


}



.title{


font-size:34px;

font-weight:800;


}



.subtitle{


margin-top:10px;

font-size:17px;

opacity:.85;


}





.container{


width:95%;

max-width:1500px;

margin:30px auto;


}





.card{


background:white;

border-radius:18px;

padding:25px;

margin-bottom:25px;

box-shadow:
0 8px 25px rgba(0,0,0,.08);


}





/* PARAMETER */


.parameter-card{


text-align:center;

background:
linear-gradient(
135deg,
#eff6ff,
white
);


border-right:8px solid #2563eb;


}



.parameter-label{


font-size:18px;

color:#64748b;


}



.parameter-name{


margin-top:10px;

font-size:36px;

font-weight:800;

color:#1d4ed8;


}






/* FILTER */


.filter-title{


font-size:22px;

font-weight:700;

margin-bottom:20px;

color:#0f172a;


}



.filter-container{


display:flex;

gap:25px;

flex-wrap:wrap;

justify-content:center;

align-items:center;


}



.filter-item{


background:#f8fafc;

padding:20px;

border-radius:15px;


}



.filter-item label{


display:block;

margin-bottom:10px;

font-weight:600;

font-size:16px;


}



input{


padding:12px;

border-radius:10px;

border:1px solid #cbd5e1;

font-size:16px;

font-family:'Vazirmatn';

text-align:center;

direction:ltr;


}





button{


background:#2563eb;

border:none;

color:white;

padding:15px 40px;

border-radius:12px;

font-size:18px;

font-family:'Vazirmatn';

cursor:pointer;

font-weight:600;

transition:.3s;


}



button:hover{


background:#1e40af;

transform:translateY(-3px);


}





/* STAT BOX */


.stats{


display:grid;

grid-template-columns:
repeat(4,1fr);

gap:20px;


}



.stat{


background:#f8fafc;

border-radius:15px;

padding:20px;

text-align:center;


}



.stat-title{


font-size:15px;

color:#64748b;


}



.stat-value{


font-size:28px;

font-weight:800;

margin-top:10px;

color:#2563eb;


}





/* CHART */


.chart-card{


height:600px;


}



canvas{


width:100%!important;

height:100%!important;


}




.footer{


text-align:center;

color:#64748b;

margin:30px;


}




@media(max-width:900px){


.stats{


grid-template-columns:
repeat(2,1fr);


}



.chart-card{


height:400px;


}



}



@media(max-width:500px){


.stats{


grid-template-columns:
1fr;


}


}




</style>


</head>






<body>

{% include 'header.html' %}



<div class="header">


<div class="title">

سامانه مانیتورینگ صنعتی SCADA

</div>


<div class="subtitle">

نمایش و تحلیل روند پارامترهای الکتریکی

</div>


</div>







<div class="container">





<div class="card parameter-card">


<div class="parameter-label">

پارامتر انتخاب شده

</div>


<div class="parameter-name">

{{ parameter }}

</div>


</div>









<div class="card">


<div class="filter-title">

انتخاب بازه زمانی

</div>



<div class="filter-container">





<div class="filter-item">


<label>

از تاریخ و ساعت

</label>


<input
id="start_time"
type="text"
placeholder="1405/04/21 14:00">


</div>





<div class="filter-item">


<label>

تا تاریخ و ساعت

</label>


<input
id="end_time"
type="text"
placeholder="1405/04/21 15:00">


</div>





<button onclick="loadGraph()">
    📈 نمایش نمودار
    </button>
    
    <button onclick="resetZoom()">
    🔄 بازگشت زوم
    </button>
    
    <button onclick="saveGraph()">
    💾 ذخیره نمودار
    </button>




</div>


</div>








<div class="card">


<div class="stats">



<div class="stat">

<div class="stat-title">
مقدار فعلی
</div>

<div class="stat-value" id="current">
-
</div>


</div>





<div class="stat">

<div class="stat-title">
کمترین مقدار
</div>

<div class="stat-value" id="min">
-
</div>


</div>





<div class="stat">

<div class="stat-title">
بیشترین مقدار
</div>

<div class="stat-value" id="max">
-
</div>


</div>





<div class="stat">

<div class="stat-title">
میانگین
</div>

<div class="stat-value" id="avg">
-
</div>


</div>



</div>


</div>








<div class="card chart-card">


<canvas id="myChart"></canvas>


</div>





</div>






<script>



$("#start_time").persianDatepicker({

format:"YYYY/MM/DD HH:mm",

timePicker:{

enabled:true

}

});




$("#end_time").persianDatepicker({

format:"YYYY/MM/DD HH:mm",

timePicker:{

enabled:true

}

});





let chart=null;






function loadGraph(){



let start =
document.getElementById(
"start_time"
).value;



let end =
document.getElementById(
"end_time"
).value;





fetch(

"/trend_data?parameter={{parameter}}&start="
+
encodeURIComponent(start)
+
"&end="
+
encodeURIComponent(end)

)



.then(r=>r.json())


.then(data=>{





if(chart)

chart.destroy();







let values=data.values;





if(values.length){



document.getElementById("current").innerHTML=
values[values.length-1];



document.getElementById("min").innerHTML=
Math.min(...values);



document.getElementById("max").innerHTML=
Math.max(...values);



let sum=
values.reduce(
(a,b)=>a+b,
0
);


document.getElementById("avg").innerHTML=
(sum/values.length).toFixed(2);


}







chart=new Chart(

document.getElementById(
"myChart"
),


{


type:"line",



data:{


labels:data.labels,


datasets:[{

label:"{{parameter}}",

data:data.values,

borderWidth:3,

tension:.35,

pointRadius:2,

pointHoverRadius:8,

fill:true

}]


},




options:{


responsive:true,


maintainAspectRatio:false,



interaction:{


mode:"index",

intersect:false


},



plugins:{

legend:{
position:"top"
},

tooltip:{
rtl:true
},

zoom:{

pan:{
enabled:true,
mode:'x'
},

zoom:{

wheel:{
enabled:true
},

pinch:{
enabled:true
},

mode:'x'

}

}

},




scales:{


x:{


ticks:{

maxRotation:0,

autoSkip:true,

maxTicksLimit:12

}


},



y:{


beginAtZero:false


}



}



}



}



);



});



}



const now = new Date();

const before =
new Date(
now.getTime() -
3600000
);



loadGraph();


function resetZoom(){

if(chart){

chart.resetZoom();

}

}



function saveGraph(){

if(!chart) return;

const link =
document.createElement("a");

link.href =
chart.toBase64Image();

link.download =
"{{parameter}}_trend.png";

link.click();

}



</script>




</body>

</html>
```
